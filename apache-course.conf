# Пример: скопируйте в корень Uniform Server и замените путь на свой.
# В httpd.conf добавьте Include с полным путём к этому файлу.
Listen 127.0.0.1:8080
Define COURSE_PUBLIC "D:/UniServerZ/www/practice_03/public"
<VirtualHost 127.0.0.1:8080>
    ServerName localhost
    DocumentRoot "${COURSE_PUBLIC}"
    <Directory "${COURSE_PUBLIC}">
        Options -Indexes
        AllowOverride All
        Require local
        DirectoryIndex index.php
    </Directory>
</VirtualHost>
